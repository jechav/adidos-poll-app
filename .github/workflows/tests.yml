name: Unit tests

# I-021: runs the dependency-free tests/unit/ suite (fakeredis + an
# in-memory poll/answer fake, no live Postgres/Redis) on every push and
# pull request, so a regression in vote acceptance or rate limiting
# fails the build in under a minute. tests/integration/ (I-022) needs
# real Postgres/Redis provisioned and isn't wired in here yet.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit
