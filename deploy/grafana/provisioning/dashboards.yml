# I-019: Grafana provisioning config for the API SLOs and Infra Health
# dashboards (deploy/grafana/dashboards/*.json). Loaded via Grafana's
# file-based dashboard provisioning mechanism so both dashboards deploy
# consistently across environments -- not built by hand in the UI. See
# https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
apiVersion: 1

providers:
  - name: poll-app
    orgId: 1
    folder: "Poll App"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/poll-app
      foldersFromFilesStructure: false
