services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      POLL_APP_DATABASE_URL: postgresql://poll_app:poll_app@postgres:5432/poll_app
      POLL_APP_REDIS_STARTUP_HOST: redis-node-1
      POLL_APP_REDIS_STARTUP_PORT: "6379"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis-node-1:
        condition: service_started
      redis-node-2:
        condition: service_started
      redis-node-3:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poll_app
      POSTGRES_PASSWORD: poll_app
      POSTGRES_DB: poll_app
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poll_app -d poll_app"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis-node-1:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    ports: ["7001:6379", "17001:16379"]
    volumes:
      - ./scripts/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-node-1-data:/data
  redis-node-2:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    ports: ["7002:6379", "17002:16379"]
    volumes:
      - ./scripts/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-node-2-data:/data
  redis-node-3:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    ports: ["7003:6379", "17003:16379"]
    volumes:
      - ./scripts/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-node-3-data:/data
  redis-cluster-init:
    image: redis:7-alpine
    depends_on: [redis-node-1, redis-node-2, redis-node-3]
    command: >
      redis-cli --cluster create
      redis-node-1:6379 redis-node-2:6379 redis-node-3:6379
      --cluster-replicas 0 --cluster-yes

volumes:
  postgres-data:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
