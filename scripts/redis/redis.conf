# Redis Cluster node config — shared by all local dev nodes (I-002).
# Production nodes use this as a base and add auth/TLS separately (tracked
# outside this issue, see I-002's "Out of Scope").

cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 15000

# Without a replica per master (the local/dev topology has none — see
# docs/setup/redis-cluster.md), Redis Cluster's default full-coverage
# requirement takes the *entire* cluster down when even one master's
# slots become unreachable, not just that master's slots. Disabling it
# keeps unaffected slots serving so "one node down" degrades gracefully
# instead of an outage, matching I-002's acceptance criteria for local
# dev; production (1 replica per master) fails over instead of relying on
# this setting.
cluster-require-full-coverage no

appendonly yes
appendfsync everysec

save 900 1
save 300 10
save 60 10000

dir /data
